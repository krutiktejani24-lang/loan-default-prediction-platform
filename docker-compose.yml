version: "3.9"

services:
  mlflow:
    image: python:3.11-slim
    container_name: loan-mlflow-server
    working_dir: /mlflow
    command: >
      bash -c "pip install --no-cache-dir mlflow==2.14.1 &&
               mlflow server --host 0.0.0.0 --port 5000
               --backend-store-uri sqlite:////mlflow/mlflow.db
               --default-artifact-root /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

  api:
    build: .
    container_name: loan-default-api
    depends_on:
      - mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_MODEL_NAME=loan-default-classifier
      - MLFLOW_MODEL_STAGE=Staging
    ports:
      - "8000:8000"

volumes:
  mlflow-data:
