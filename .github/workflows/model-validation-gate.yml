name: model-validation-gate

# Runs on every PR that touches model/data/config code, and blocks merge
# (configure this as a required status check under branch protection rules)
# if any validation step fails.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "config/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/model-validation-gate.yml"
  workflow_dispatch: {}

jobs:
  model-validation-gate:
    name: Validate schema, tests & model metrics
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Optional: point at a real MLflow tracking server via repo/org secrets.
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate / refresh sample dataset
        run: python scripts/generate_sample_data.py

      - name: Run unit tests (pytest)
        run: pytest -v --cov=src --cov-report=term-missing

      - name: Run data schema validation (Great Expectations)
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from src.data.loader import load_data
          from src.data.schema import validate_dataframe

          df = load_data("data/sample_loan_data.csv")
          success, summary = validate_dataframe(df)
          print(summary)
          if not success:
              print("::error::Data schema validation FAILED — blocking PR.")
              sys.exit(1)
          PY

      - name: Train candidate model & enforce metric thresholds
        run: python scripts/validate_and_gate.py

      - name: Upload candidate model artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-model
          path: artifacts/candidate_model.joblib
          retention-days: 14

      - name: Gate summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Model validation gate PASSED — PR is eligible to merge, model registered/promoted."
          else
            echo "❌ Model validation gate FAILED — PR is BLOCKED. See logs above for the failing check."
          fi
